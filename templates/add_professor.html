<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Professor | Student Risk System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="dashboard-page">

<div class="dashboard-layout">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">🎓</div>

            <div>
                <strong>ARPS</strong>
                <small>Student Risk System</small>
            </div>
        </div>

        <nav class="sidebar-nav">

            <a href="{{ url_for('dashboard') }}" class="nav-item">
                🏠
                <span>Dashboard</span>
            </a>

            <a href="{{ url_for('professors') }}"
               class="nav-item active">
                👨‍🏫
                <span>Professors</span>
            </a>

            <a href="#" class="nav-item">
                👨‍🎓
                <span>Students</span>
            </a>

            <a href="#" class="nav-item">
                📚
                <span>Courses</span>
            </a>

        </nav>

        <a href="{{ url_for('logout') }}"
           class="logout-button">
            🚪
            <span>Logout</span>
        </a>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Add Professor</h1>

                <p>
                    Create a professor profile and login account.
                </p>
            </div>

        </header>


        {% if error %}

        <div class="page-alert">
            {{ error }}
        </div>

        {% endif %}


        <section class="dashboard-card form-card">

            <form method="POST">

                <h2>Professor Information</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Employee Number</label>

                        <input
                            type="text"
                            name="employee_number"
                            placeholder="e.g. EMP-001"
                            required>
                    </div>


                    <div class="form-group">
                        <label>Email</label>

                        <input
                            type="email"
                            name="email"
                            placeholder="professor@example.com">
                    </div>


                    <div class="form-group">
                        <label>First Name</label>

                        <input
                            type="text"
                            name="first_name"
                            placeholder="First name"
                            required>
                    </div>


                    <div class="form-group">
                        <label>Last Name</label>

                        <input
                            type="text"
                            name="last_name"
                            placeholder="Last name"
                            required>
                    </div>

                </div>


                <div class="form-divider"></div>


                <h2>Login Account</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Username</label>

                        <input
                            type="text"
                            name="username"
                            placeholder="Username"
                            required>
                    </div>


                    <div class="form-group">
                        <label>Password</label>

                        <input
                            type="password"
                            name="password"
                            placeholder="Password"
                            required>
                    </div>

                </div>


                <div class="form-actions">

                    <a
                        href="{{ url_for('professors') }}"
                        class="secondary-button">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="primary-button">
                        Create Professor
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

</body>
</html>
