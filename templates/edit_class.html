<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Class | Student Risk System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="dashboard-page">


<div class="dashboard-layout">


    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">🎓</div>

            <div>
                <strong>ARPS</strong>
                <small>Student Risk System</small>
            </div>

        </div>


        <nav class="sidebar-nav">

            <a href="{{ url_for('dashboard') }}" class="nav-item">
                🏠
                <span>Dashboard</span>
            </a>

            <a href="{{ url_for('professors') }}" class="nav-item">
                👨‍🏫
                <span>Professors</span>
            </a>

            <a href="{{ url_for('students') }}" class="nav-item">
                🎓
                <span>Students</span>
            </a>

            <a href="{{ url_for('courses') }}" class="nav-item">
                📚
                <span>Courses</span>
            </a>

            <a href="{{ url_for('classes') }}" class="nav-item active">
                🏫
                <span>Classes</span>
            </a>

            <a href="#" class="nav-item">
                📝
                <span>Academic Records</span>
            </a>

            <a href="#" class="nav-item">
                🤖
                <span>Predictions</span>
            </a>

            <a href="#" class="nav-item">
                📖
                <span>Learning Modules</span>
            </a>

            <a href="#" class="nav-item">
                📊
                <span>Reports</span>
            </a>

            <a href="#" class="nav-item">
                ⚙️
                <span>Settings</span>
            </a>

        </nav>


        <a href="{{ url_for('logout') }}"
           class="logout-button">

            🚪
            <span>Logout</span>

        </a>

    </aside>



    <main class="main-content">


        <header class="topbar">

            <div>

                <h1>Edit Class</h1>

                <p>
                    Update class information.
                </p>

            </div>

        </header>



        <section class="dashboard-card">


            {% if error %}

            <div class="alert alert-danger">
                {{ error }}
            </div>

            {% endif %}



            <form method="POST">


                <div class="form-group">

                    <label>Course *</label>

                    <select name="course_id" required>

                        {% for course in courses %}

                        <option
                            value="{{ course['course_id'] }}"
                            {% if course['course_id'] == class_record['course_id'] %}
                            selected
                            {% endif %}
                        >

                            {{ course["course_code"] }}
                            -
                            {{ course["course_title"] }}

                        </option>

                        {% endfor %}

                    </select>

                </div>



                <div class="form-group">

                    <label>Professor *</label>

                    <select name="professor_id" required>

                        {% for professor in professors %}

                        <option
                            value="{{ professor['professor_id'] }}"
                            {% if professor['professor_id'] == class_record['professor_id'] %}
                            selected
                            {% endif %}
                        >

                            {{ professor["first_name"] }}
                            {{ professor["last_name"] }}

                            -
                            {{ professor["employee_number"] }}

                        </option>

                        {% endfor %}

                    </select>

                </div>



                <div class="form-group">

                    <label>Section</label>

                    <input
                        type="text"
                        name="section"
                        value="{{ class_record['section'] or '' }}"
                    >

                </div>



                <div class="form-group">

                    <label>School Year</label>

                    <input
                        type="text"
                        name="school_year"
                        value="{{ class_record['school_year'] or '' }}"
                    >

                </div>



                <div class="form-group">

                    <label>Semester</label>

                    <select name="semester">

                        <option value="">
                            Select Semester
                        </option>

                        <option
                            value="1st Semester"
                            {% if class_record['semester'] == '1st Semester' %}
                            selected
                            {% endif %}
                        >
                            1st Semester
                        </option>

                        <option
                            value="2nd Semester"
                            {% if class_record['semester'] == '2nd Semester' %}
                            selected
                            {% endif %}
                        >
                            2nd Semester
                        </option>

                        <option
                            value="Summer"
                            {% if class_record['semester'] == 'Summer' %}
                            selected
                            {% endif %}
                        >
                            Summer
                        </option>

                    </select>

                </div>



                <div style="margin-top:25px;">

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Update Class

                    </button>


                    <a
                        href="{{ url_for('classes') }}"
                        class="btn">

                        Cancel

                    </a>

                </div>


            </form>


        </section>


    </main>

</div>


</body>

</html>
